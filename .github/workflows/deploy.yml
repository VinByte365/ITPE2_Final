# NOTE: This workflow publishes only the static frontend (legacy/bundled content) to
# GitHub Pages. The LMS requires the Express API (server/) hosted separately with
# production env (COOKIE_SECURE=true, TRUST_PROXY=true, exact CORS_ORIGIN) and the
# frontend built with VITE_API_BASE_URL pointing at that API.
name: Deploy static site to GitHub Pages (legacy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
